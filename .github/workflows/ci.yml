name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # The keyboard hook is a Win32 SetWindowsHookExW P/Invoke, so the plugin only builds and runs its
    # tests on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SystemHotkeys.slnx

      - name: Build
        run: dotnet build SystemHotkeys.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test SystemHotkeys.slnx --no-build --configuration Release
