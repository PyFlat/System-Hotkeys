name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # The integration tests start the real keyboard hook, so every platform runs them.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SystemHotkeys.slnx

      - name: Build
        run: dotnet build SystemHotkeys.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test SystemHotkeys.slnx --no-build --configuration Release
